<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat Challenge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
<header><div><small>TELEGRAM • BEATMAKERS</small><h1>🎧 Beat Challenge</h1></div><button onclick="profile()">👤</button></header>
<section class="hero"><h2>🎯 Desafio</h2><div id="challenge">Carregando...</div><button class="primary" onclick="newChallenge()">NOVO DESAFIO</button></section>
<section class="panel">
<h3>📤 Enviar Beat</h3>
<p>Envie seu MP3/WAV para o bot e informe o <b>file_id</b> recebido. A submissão fica vinculada ao desafio atual.</p>
<input id="fileId" placeholder="file_id do Telegram">
<input id="fileName" placeholder="Nome do beat">
<button class="primary" onclick="submitBeat()">ENVIAR BEAT</button>
<div id="sendMsg"></div>
</section>
<section class="panel"><h3>⚔️ Batalha / Votação</h3><button onclick="loadSubmissions()">CARREGAR BEATS</button><div id="subs"></div></section>
<section class="panel"><h3>🏆 Ranking</h3><button onclick="ranking()">VER RANKING</button><div id="rank"></div></section>
<footer>Jogo musical competitivo. Sem apostas ou prêmios em dinheiro.</footer>
</div>
<script src="/app.js"></script>
</body>
</html>
